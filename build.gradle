plugins {
    id 'application'
}

// 'mainClassName' foi depreciado; usa-se 'application.mainClass'
application {
    mainClass = 'ExperimentMain'
}

version = '0.0.5'

// 'sourceCompatibility' simples ainda funciona, mas a forma recomendada é via java {}
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// Encoding continua igual
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// O bloco 'if (!hasProperty(...))' não é mais necessário com application plugin moderno
// mainClass já está definido acima

repositories {
    mavenCentral()
    maven {
        url = "https://github.com/rosjava/rosjava_mvn_repo/raw/master"
    }
    maven { url = 'https://jitpack.io' }
    maven {
        url = 'https://cst-group.github.io/cst-dependencies/maven-repo/'
    }
}

dependencies {
    implementation 'com.github.CST-Group:cst-desktop:1.1.4'
    implementation 'com.github.CST-Group:WS3DProxy:0.0.7'
    implementation 'org.json:json:20180813'
    testImplementation 'junit:junit:4.10'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveClassifier = 'full'
    manifest {
        attributes(
            'Main-Class': application.mainClass.get()
        )
    }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath
            .findAll { it.name.endsWith('jar') }
            .collect { zipTree(it) }
    }
    exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
}
